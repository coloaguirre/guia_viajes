# Parámetros del viaje y del contenido. Se versiona.
# (Las claves sueltas van ANTES de la primera tabla [..].)
# Celdas o fragmentos que no son lugares.
ignorar = ["casa", "excursion", "excursión", "dia de reserva", "día de reserva", "isla pinguino", "total viaje"]

[viaje]
nombre = "Patagonia nov 2026"
# Hoja del Excel con el itinerario (si no se indica, la primera que
# tenga una columna "Tramo / Base").
hoja = "Plan B (+Pla San Julian)"
# Pista para el geocoder: país y, si ayuda, región (en texto libre).
pais = "Argentina"
region = ""

# Nombres como aparecen en el Excel (en minúsculas, sin acentos) -> nombre canónico.
[alias]
"bs as" = "Buenos Aires"
"rio colorado" = "Río Colorado"
"comodoro riv" = "Comodoro Rivadavia"
"gdor. gregores" = "Gobernador Gregores"
"gregores" = "Gobernador Gregores"
"l.piedrabuena" = "Comandante Luis Piedrabuena"
"piedrabuena" = "Comandante Luis Piedrabuena"
"pto san julian" = "Puerto San Julián"
"puerto san julian" = "Puerto San Julián"
"pn perito moreno" = "Parque Nacional Perito Moreno"
"p.n. perito moreno" = "Parque Nacional Perito Moreno"
"ea. la oriental" = "Estancia La Oriental"
"ea la oriental" = "Estancia La Oriental"
"la oriental" = "Estancia La Oriental"
"cabo dos bahias" = "Cabo Dos Bahías"
"bahia bustamante" = "Bahía Bustamante"

# Lugares que no están en las columnas del itinerario pero sí en el viaje
# (excursiones, paradas de ruta). Día = cuándo se visitan.
[[extra]]
nombre = "Isla Pingüino"
dias = [6]
[[extra]]
nombre = "Ría Deseado"
dias = [7]
[[extra]]
nombre = "Cabo Blanco"
dias = [7]
geo = "Reserva Natural Cabo Blanco, Santa Cruz, Argentina"
[[extra]]
nombre = "Parque Nacional Monte León"
dias = [10]
[[extra]]
nombre = "Península San Julián"
dias = [9]
geo = "Península San Julián, Santa Cruz, Argentina"
[[extra]]
nombre = "Isla Leones"
dias = [3]
geo = "Isla Leones, Chubut, Argentina"
[[extra]]
nombre = "Puerto Madryn"
dias = [2, 18]
[[extra]]
nombre = "Trelew"
dias = [2, 18]
[[extra]]
nombre = "Viedma"
dias = [2, 18]
[[extra]]
nombre = "Bahía Blanca"
dias = [1, 18]
[[extra]]
nombre = "Caleta Olivia"
dias = [5]
[[extra]]
nombre = "Comodoro Rivadavia"
dias = [5]
[[extra]]
nombre = "Sarmiento"
dias = [17]
geo = "Sarmiento, Chubut, Argentina"
[[extra]]
nombre = "Bosque Petrificado Sarmiento"
dias = [17]

# Rutas de vuelta que son el mismo camino que una de ida: se fusionan
# (slug a fusionar -> slug que queda).
[fusionar]
"ruta-rio-colorado-buenos-aires" = "ruta-buenos-aires-rio-colorado"
"ruta-comodoro-rivadavia-rio-colorado" = "ruta-rio-colorado-camarones"

# Coordenadas manuales para lo que el geocoder no encuentra.
[geo_fix]
"estancia-la-oriental" = { lat = -47.84, lon = -72.17 }
"isla-pinguino" = { lat = -47.91, lon = -65.72 }
"bosque-petrificado-sarmiento" = { lat = -45.86, lon = -69.12 }  # ~30 km al sur de Sarmiento, José Ormachea  # costa norte del Lago Belgrano, pie del Cerro León

# Consultas de geocoding por lugar (cuando el nombre solo es ambiguo).
[geo_query]
"rio-colorado" = "Río Colorado, Río Negro, Argentina"
"camarones" = "Camarones, Chubut, Argentina"
"estancia-la-oriental" = "Estancia La Oriental, Parque Nacional Perito Moreno, Santa Cruz, Argentina"
"cabo-raso" = "Cabo Raso, Chubut, Argentina"

[relato]
min_palabras = 500
max_palabras = 1500
temas = [
  "Historia",
  "Naturaleza y biología",
  "Paisaje y geología",
  "Comidas y bebidas",
  "Costumbres y gente",
  "Qué ver y qué hacer",
]

[audio]
# Voz neural (edge-tts). Opciones rioplatenses: es-AR-ElenaNeural, es-AR-TomasNeural,
# es-UY-ValentinaNeural, es-UY-MateoNeural.
voz = "es-AR-ElenaNeural"
velocidad = "-5%"
# Dónde se publican los archivos de audio (carpeta local, fuera del repo principal).
carpeta = "../guia_viajes_audio"
# URL pública desde la que la app los descarga.
base_url = "https://coloaguirre.github.io/guia_viajes_audio/"
# Bitrate Opus mono (24k suena bien para voz y pesa ~11 MB por hora).
bitrate = "24k"
